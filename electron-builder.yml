appId: com.inventoryManagement.app
productName: 库存管理系统
executableName: InventoryManagement
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.*'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
  - node_modules/better-sqlite3/**
  - out/renderer/**
mac:
  notarize: false
  target:
    - dmg
win:
  signAndEditExecutable: false  # 禁用签名，避免在无管理员/开发人员模式时解压 winCodeSign 失败
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  target:
    - AppImage
